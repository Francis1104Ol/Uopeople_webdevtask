<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us Form</title>

<style>
    /* Provides a clean, readable layout to improve user experience across devices */
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    /* Creates spacing between form sections to improve readability and visual structure */
    .form-group {
        margin-bottom: 15px;
    }

    /* Ensures labels are clearly visible and associated with inputs for accessibility */
    label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
    }

    .form-group input[type="radio"] {
    margin: 0 2px 0 10px; /* small gap before label, tight overall */
    }

.form-group label  {
    margin-right: 3px; /* reduces label spacing impact */
    }
    /* Standardizes input size for consistent form alignment and usability */
     textarea, select {
        width: 300px;
        padding: 8px;
    }

    /* Highlights validation errors so users can quickly identify and correct issues */
    .error {
        color: red;
        font-size: 14px;
    }
    .radio-group {
    display: flex;           /* puts radios in a row */
    gap: 12px;               /* controls spacing BETWEEN options */
    align-items: center;     /* keeps everything aligned */
    }

.radio-group label {
    display: flex;
    align-items: center;
    gap: 4px;                /* keeps radio CLOSE to text */
    margin: 0;               /* removes default spacing */
    }
</style>
</head>

<body>

<h2>Contact Us</h2>

<!-- Main form is designed to send validated user data securely to the server using POST -->
<form id="contactForm" method="POST" action="server.php" onsubmit="return validateForm();">

    <!-- Collects user identity information required for follow-up communication -->
    <div class="form-group">
        <label>Name:</label>
        <textarea id="name"></textarea>
        <div id="nameError" class="error"></div>
    </div>

    <!-- Captures email to enable digital communication and user verification -->
    <div class="form-group">
        <label>Email:</label>
        <textarea id="email"></textarea>
        <div id="emailError" class="error"></div>
    </div>

    <!-- Collects phone number for alternative contact methods such as calls or SMS -->
    <div class="form-group">
        <label>Phone Number:</label>
        <textarea id="phone"></textarea>
        <div id="phoneError" class="error"></div>
    </div>

    <!-- Allows users to describe their inquiry so the request can be properly categorized -->
    <div class="form-group">
        <label>Message:</label>
        <textarea id="message"></textarea>
        <div id="messageError" class="error"></div>
    </div>

    <!-- Enables user preference selection to improve communication efficiency -->
<div class="form-group">
    <label>Preferred Contact Method:</label>

    <div class="radio-group">
        <label><input type="radio" name="contactMethod" value="Email"> Email</label>
        <label><input type="radio" name="contactMethod" value="Phone"> Phone</label>
        <label><input type="radio" name="contactMethod" value="Both"> Both</label>
    </div>
</div>

    <!-- Helps route user requests to the correct department or support category -->
    <div class="form-group">
        <label>Inquiry Type:</label>
        <select id="inquiryType">
            <option value="">Select an option</option>
            <option value="General Inquiry">General Inquiry</option>
            <option value="Support Request">Support Request</option>
            <option value="Feedback">Feedback</option>
        </select>
    </div>

    <!-- Submits validated form data to the server for processing and storage -->
    <button type="submit">Submit</button>
</form>

<!-- Preview section allows users to review data before final submission, reducing input errors -->
<h3>Preview Data</h3>
<form method="GET" action="">
    <!-- Triggers client-side preview without sending data to the server -->
    <button type="button" onclick="previewData()">Preview</button>
</form>

<!-- Displays user-entered data so they can verify correctness before submission -->
<div id="preview"></div>

<script>

// Ensures all required data is valid before allowing submission to prevent incorrect server data
function validateForm() {

    let valid = true;

    // Retrieves user input for validation checks
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let message = document.getElementById("message").value.trim();

    // Clears previous errors to avoid confusion from outdated messages
    document.getElementById("nameError").innerText = "";
    document.getElementById("emailError").innerText = "";
    document.getElementById("phoneError").innerText = "";
    document.getElementById("messageError").innerText = "";

    // Ensures required identity field is not missing
    if (name === "") {
        document.getElementById("nameError").innerText = "Name is required.";
        valid = false;
    }

    // Validates email format to ensure reliable communication channel
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        document.getElementById("emailError").innerText = "Invalid email format.";
        valid = false;
    }

    // Ensures phone number follows standard 10-digit format for consistency
    let phonePattern = /^[0-9]{10}$/;
    if (!phonePattern.test(phone)) {
        document.getElementById("phoneError").innerText = "Phone must be 10 digits.";
        valid = false;
    }

    // Ensures user provides context for their request
    if (message === "") {
        document.getElementById("messageError").innerText = "Message is required.";
        valid = false;
    }

    return valid;
}

// Displays a temporary preview so users can confirm correctness before submission
function previewData() {

    // Collects form data without submitting it to the server
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let message = document.getElementById("message").value;
    let inquiry = document.getElementById("inquiryType").value;

    // Retrieves selected communication preference if chosen
    let contactMethod = document.querySelector('input[name="contactMethod"]:checked');
    let method = contactMethod ? contactMethod.value : "Not selected";

    // Renders collected data for user verification before final submission
    document.getElementById("preview").innerHTML = `
        <h4>Preview Information</h4>
        <p><strong>Name:</strong> ${name}</p>
        <p><strong>Email:</strong> ${email}</p>
        <p><strong>Phone:</strong> ${phone}</p>
        <p><strong>Message:</strong> ${message}</p>
        <p><strong>Contact Method:</strong> ${method}</p>
        <p><strong>Inquiry Type:</strong> ${inquiry}</p>
    `;
}

</script>

</body>
</html>
